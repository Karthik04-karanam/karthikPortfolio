<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8c291"/>
      <stop offset="100%" stop-color="#e58e26"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#avatar-bg)" stroke="url(#ring-grad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Subtle Grid inside avatar -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="360" />
    <line x1="200" y1="20" x2="200" y2="380" />
    <line x1="300" y1="40" x2="300" y2="360" />
    <line x1="40" y1="100" x2="360" y2="100" />
    <line x1="20" y1="200" x2="380" y2="200" />
    <line x1="40" y1="300" x2="360" y2="300" />
  </g>

  <!-- Developer Silhouette / Illustration -->
  <g id="character">
    <!-- Suit / Shirt -->
    <path d="M120 380 Q200 320 280 380 L280 400 L120 400 Z" fill="url(#suit)" stroke="#334155" stroke-width="2"/>
    <path d="M165 340 L200 385 L235 340 L200 330 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Collar & Tie -->
    <path d="M192 342 L208 342 L204 380 L196 380 Z" fill="#38bdf8"/>
    
    <!-- Neck -->
    <rect x="182" y="240" width="36" height="45" rx="6" fill="#f8c291"/>
    
    <!-- Head -->
    <ellipse cx="200" cy="180" rx="60" ry="72" fill="#f8c291"/>
    
    <!-- Hair -->
    <path d="M140 170 Q135 110 200 110 Q265 110 260 170 Q240 130 200 130 Q160 130 140 170 Z" fill="#1e293b"/>
    <path d="M140 170 Q135 140 160 125 Q180 115 200 115 Q240 115 255 140 Q260 160 260 175 Q250 150 230 140 Q190 125 150 155 Z" fill="#0f172a"/>

    <!-- Eyes / Glasses -->
    <rect x="162" y="165" width="28" height="20" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <rect x="210" y="165" width="28" height="20" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="190" y1="175" x2="210" y2="175" stroke="#38bdf8" stroke-width="3"/>
    <!-- Eye pupils -->
    <circle cx="176" cy="175" r="3" fill="#1e293b"/>
    <circle cx="224" cy="175" r="3" fill="#1e293b"/>

    <!-- Gentle Smile -->
    <path d="M185 215 Q200 228 215 215" fill="none" stroke="#b33939" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Coding Particle Elements -->
  <text x="50" y="120" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="bold" opacity="0.85">&lt;/&gt;</text>
  <text x="320" y="140" fill="#a855f7" font-family="monospace" font-size="22" font-weight="bold" opacity="0.85">{ }</text>
  <text x="45" y="280" fill="#34d399" font-family="monospace" font-size="18" font-weight="bold" opacity="0.85">Python</text>
  <text x="315" y="270" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold" opacity="0.85">JS</text>
</svg>
